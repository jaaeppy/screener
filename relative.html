<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야수의 심장 — 시장 상대강도</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; }

/* GNB */
.gnb { background: #fff; border-bottom: 1px solid #ebebeb; position: sticky; top: 0; z-index: 200; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.gnb::-webkit-scrollbar { display: none; }
.gnb-inner { max-width: 1400px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 0; height: 52px; min-width: max-content; }
.gnb-logo { font-size: 16px; font-weight: 700; color: #1a1a1a; letter-spacing: -0.5px; margin-right: 28px; text-decoration: none; white-space: nowrap; flex-shrink: 0; }
.gnb-logo span { color: #534AB7; }
.gnb-nav { display: flex; align-items: center; height: 100%; gap: 2px; }
.gnb-tab { font-size: 14px; color: #888; text-decoration: none; padding: 0 14px; height: 100%; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: color 0.15s; white-space: nowrap; flex-shrink: 0; }
.gnb-tab:hover { color: #333; }
.gnb-tab.active { color: #1a1a1a; font-weight: 600; border-bottom-color: #1a1a1a; }

.wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
.green { color: #1D9E75; } .red { color: #E24B4A; }

/* Page header */
.page-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.page-title { font-size: 20px; font-weight: 500; }
.updated-label { font-size: 11px; color: #aaa; }
.period-tabs { display: flex; background: #f0f0ee; border: 1px solid #e0e0de; border-radius: 10px; padding: 3px; gap: 2px; }
.period-tab { padding: 5px 18px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #aaa; cursor: pointer; border: none; background: transparent; font-family: inherit; }
.period-tab.active { background: #fff; color: #1a1a1a; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

/* Market index cards */
.mkt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.mkt-card { background: #fff; border-radius: 12px; border: 0.5px solid #e5e5e5; padding: 16px 18px; }
.mkt-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.mkt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.mkt-dot.k { background: #185FA5; } .mkt-dot.q { background: #534AB7; }
.mkt-card-title { font-size: 13px; font-weight: 700; }
.mkt-card-title.k { color: #185FA5; } .mkt-card-title.q { color: #534AB7; }
.mkt-chart-wrap { background: #f8f8f6; border-radius: 6px; padding: 6px 4px 4px; margin-bottom: 10px; }
.mkt-periods { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.mkt-period { text-align: center; padding: 7px 4px; border-radius: 8px; border: 1px solid #ebebeb; cursor: pointer; transition: .15s; }
.mkt-period:hover { background: #f8f8f6; }
.mkt-period.active { border-color: #534AB7; background: #EEEDFE; }
.mkt-period-label { font-size: 10px; color: #aaa; font-weight: 600; letter-spacing: .04em; margin-bottom: 3px; }
.mkt-period-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Filters */
.filter-area { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.filter-label { font-size: 11px; color: #aaa; white-space: nowrap; }
.filter-divider { width: 0.5px; height: 20px; background: #e0e0e0; align-self: center; }
.btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 0.5px solid #ddd; background: #fff; cursor: pointer; color: #555; white-space: nowrap; }
.btn:hover:not(.active-mkt):not(.active-dir):not(.active-align) { background: #f5f5f3; }
.btn.active-mkt   { background: #E6F1FB; color: #185FA5; border-color: #85B7EB; }
.btn.active-dir   { background: #EEEDFE; color: #534AB7; border-color: #AFA9EC; }
.btn.active-align { background: #D4F0E6; color: #0D6B4E; border-color: #7ECDB3; }

/* Search + sector row */
.top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.search { padding: 7px 12px; border-radius: 8px; border: 0.5px solid #ddd; font-size: 13px; width: 200px; outline: none; background: #fff; }
.search:focus { border-color: #534AB7; }
.sector-select { padding: 7px 12px; border-radius: 8px; border: 0.5px solid #ddd; font-size: 12px; background: #fff; color: #555; outline: none; cursor: pointer; }
.count-label { font-size: 12px; color: #888; margin-left: auto; }

/* Badges */
.kospi  { background: #E6F1FB; color: #185FA5; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 500; }
.kosdaq { background: #EEEDFE; color: #534AB7; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 500; }
.sector-tag { background: #F1EFE8; color: #5F5E5A; font-size: 11px; padding: 2px 7px; border-radius: 4px; }
.badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
.badge.align  { background: #D4F0E6; color: #0D6B4E; }
.badge.first  { background: #FDE8F8; color: #8B1A7E; }

/* Table */
.table-wrap { background: #fff; border-radius: 12px; border: 0.5px solid #e5e5e5; overflow-x: auto; }
table { width: 100%; min-width: max-content; border-collapse: collapse; font-size: 13px; }
th { padding: 10px 12px; text-align: left; font-weight: 500; font-size: 12px; color: #888; border-bottom: 0.5px solid #eee; cursor: pointer; white-space: nowrap; background: #fafafa; user-select: none; }
th:hover { color: #333; }
th.sorted { color: #534AB7; }
th .sort-arrow { font-size: 10px; opacity: .4; margin-left: 2px; }
th.sorted .sort-arrow { opacity: 1; color: #534AB7; }
th.period-th { min-width: 110px; text-align: center; }
th.period-th.sorted { background: #EEEDFE; }
td { padding: 8px 12px; border-bottom: 0.5px solid #f0f0f0; vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafaf8; }
.section-row td { background: #f7f6f3; font-size: 11px; font-weight: 600; color: #555; padding: 6px 12px; border-bottom: 0.5px solid #eee; border-top: 0.5px solid #eee; }
.stock-name { font-size: 13px; font-weight: 600; }

.empty { padding: 48px; text-align: center; color: #aaa; font-size: 14px; }

/* Period column cell */
.p-col { text-align: center; }
.p-chg { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; margin-bottom: 3px; }
.p-rel { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; display: inline-block; }
.p-rel.up { background: #EBF8F2; color: #1D9E75; }
.p-rel.dn { background: #FCEBEB; color: #E24B4A; }
.p-rel.neu { background: #f0f0f0; color: #aaa; }

/* Mini chart cell */
.mini-chart { display: flex; align-items: center; justify-content: center; }

/* Mobile cards */
.card-list { display: none; }
.card { background: #fff; border-radius: 12px; border: 0.5px solid #e5e5e5; padding: 14px; margin-bottom: 10px; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.card-name { font-size: 15px; font-weight: 600; }
.card-code { font-size: 11px; color: #aaa; margin-top: 2px; }
.card-divider { height: 0.5px; background: #f0f0f0; margin: 10px 0; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.card-item-label { font-size: 11px; color: #aaa; margin-bottom: 3px; }
.card-item-val { font-size: 14px; font-weight: 600; }

@media (max-width: 768px) {
  .wrap { padding: 16px 12px; }
  .mkt-grid { grid-template-columns: 1fr; gap: 10px; }
  .filter-divider { display: none; }
  .filter-area { gap: 8px; margin-bottom: 12px; }
  .search { width: 100%; }
  .count-label { margin-left: 0; }
  .table-wrap { display: none; }
  .card-list { display: block; }
  .period-tab { padding: 5px 12px; font-size: 12px; }
}
</style>

<script>
// ── 상태 ─────────────────────────────────────────────────────────────────────
let ALL = [];
let activePeriod = 0, sortDir = -1, sortByName = false;
let state = { mkt: '전체', dir: '전체', align: '전체', sector: '전체', q: '' };
const REL_KEYS  = ['rel',  'rel2', 'rel3', 'rel4'];
const CHG_KEYS  = ['chg',  'chg2', 'chg3', 'chg4'];
const PERIOD_LABELS = ['1주', '2주', '3주', '한달'];

// ── SVG mini chart (from screener) ───────────────────────────────────────────
function chartSvg(candles, ma5, ma10, ma20, ma30, w, h) {
  if (!candles || !candles.length) return '';
  const pad = {t:4,b:2,l:2,r:2};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const allVals = [
    ...candles.flatMap(c=>[c[1],c[2]]),
    ...ma5.filter(v=>v>0), ...ma10.filter(v=>v>0),
    ...ma20.filter(v=>v>0), ...ma30.filter(v=>v>0)
  ];
  if (!allVals.length) return '';
  const lo = Math.min(...allVals), hi = Math.max(...allVals);
  const range = hi - lo || 1;
  const n = candles.length;
  const slotW = iw / n;
  const cw = Math.max(1, slotW * 0.55);
  const py = v => pad.t + ih - ((v - lo) / range * ih);
  const px = i => pad.l + (i + 0.5) * slotW;
  let s = `<svg width="${w}" height="${h}" style="display:block;overflow:visible">`;
  candles.forEach(([o,hh,l,c],i) => {
    const x = px(i), bull = c >= o, col = bull ? '#1D9E75' : '#E24B4A';
    const top = Math.min(py(o),py(c)), bh = Math.max(1,Math.abs(py(o)-py(c)));
    s += `<line x1="${x}" y1="${py(hh)}" x2="${x}" y2="${py(l)}" stroke="${col}" stroke-width="1" opacity="0.6"/>`;
    s += `<rect x="${x-cw/2}" y="${top}" width="${cw}" height="${bh}" fill="${col}" opacity="0.85"/>`;
  });
  const line = (vals, color) => {
    let d='', prev=null;
    vals.forEach((v,i) => {
      if (!v) { prev=null; return; }
      const x=px(i), y=py(v);
      d += prev===null ? `M${x.toFixed(1)},${y.toFixed(1)}` : `L${x.toFixed(1)},${y.toFixed(1)}`;
      prev = v;
    });
    if (d) s += `<path d="${d}" stroke="${color}" stroke-width="1.2" fill="none"/>`;
  };
  line(ma30,'#3498DB'); line(ma20,'#9B59B6'); line(ma10,'#F5A623'); line(ma5,'#E24B4A');
  s += '</svg>';
  return s;
}

// ── Canvas index chart ────────────────────────────────────────────────────────
function drawIndexChart(canvasId, chartData) {
  if (!chartData || !chartData.candles || !chartData.candles.length) return;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 520, H = 120;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const { candles, vols, ma5, ma10, ma20, ma30 } = chartData;

  const PAD = {t:6, b:8, l:6, r:6};
  const CRATIO = 0.65, GAP = 3;
  const iw = W - PAD.l - PAD.r;
  const ih = H - PAD.t - PAD.b;
  const candleH = Math.round(ih * CRATIO);
  const volH = ih - candleH - GAP;

  const n = candles.length;
  const allVals = [
    ...candles.flatMap(c=>[c[1],c[2]]),
    ...(ma5||[]).filter(v=>v>0), ...(ma10||[]).filter(v=>v>0),
    ...(ma20||[]).filter(v=>v>0), ...(ma30||[]).filter(v=>v>0)
  ];
  if (!allVals.length) return;
  const lo = Math.min(...allVals), hi = Math.max(...allVals);
  const range = hi - lo || 1;
  const slotW = iw / n;
  const cw = Math.max(1.5, slotW * 0.55);
  const py = v => PAD.t + candleH - ((v - lo) / range * candleH);
  const px = i => PAD.l + (i + 0.5) * slotW;
  const volTop = PAD.t + candleH + GAP;

  // Volume
  if (vols && vols.length === n) {
    const maxVol = Math.max(...vols) || 1;
    ctx.strokeStyle = '#ebebeb'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(PAD.l, volTop-1); ctx.lineTo(W-PAD.r, volTop-1); ctx.stroke();
    vols.forEach((v,i) => {
      const bull = candles[i][3] >= candles[i][0];
      ctx.fillStyle = bull ? 'rgba(29,158,117,0.4)' : 'rgba(226,75,74,0.4)';
      const bh = Math.max(1,(v/maxVol)*volH);
      ctx.fillRect(px(i)-cw/2, volTop+volH-bh, cw, bh);
    });
  }

  // Candles
  candles.forEach(([o,hh,l,c],i) => {
    const bull = c >= o, col = bull ? '#1D9E75' : '#E24B4A';
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(px(i), py(hh)); ctx.lineTo(px(i), py(l)); ctx.stroke();
    ctx.globalAlpha = 0.85; ctx.fillStyle = col;
    const top = Math.min(py(o),py(c)), bh = Math.max(1.5, Math.abs(py(o)-py(c)));
    ctx.fillRect(px(i)-cw/2, top, cw, bh);
    ctx.globalAlpha = 1;
  });

  // MA lines
  const drawLine = (vals, color, lw=1.5) => {
    if (!vals || !vals.length) return;
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
    let started = false;
    vals.forEach((v,i) => {
      if (!v) { started=false; return; }
      if (!started) { ctx.moveTo(px(i), py(v)); started=true; }
      else ctx.lineTo(px(i), py(v));
    });
    ctx.stroke();
  };
  drawLine(ma30,'#3498DB'); drawLine(ma20,'#9B59B6'); drawLine(ma10,'#F5A623'); drawLine(ma5,'#E24B4A');

  // Legend
  const legends = [['MA5','#E24B4A'],['MA10','#F5A623'],['MA20','#9B59B6'],['MA30','#3498DB']];
  ctx.font = '8px -apple-system, sans-serif'; ctx.textAlign = 'left';
  let lx = PAD.l;
  legends.forEach(([label, col]) => {
    ctx.fillStyle = col; ctx.fillRect(lx, PAD.t+1, 10, 2);
    ctx.fillStyle = '#aaa'; ctx.fillText(label, lx+13, PAD.t+5); lx += 34;
  });
}

// ── 유틸 ─────────────────────────────────────────────────────────────────────
function fmtChg(v) {
  if (v == null) return '—';
  const cls = v > 0 ? 'green' : v < 0 ? 'red' : '';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}
function fmtAlign(s) {
  if (s.first_full_align) return '<span class="badge first">최초정배열</span>';
  if (s.full_align)       return '<span class="badge align">전체정배열</span>';
  return '—';
}
function periodCell(s, p) {
  const chg = s[CHG_KEYS[p]] ?? null;
  const rel  = s[REL_KEYS[p]]  ?? null;
  if (chg == null) return '<td class="p-col">—</td>';
  const chgCls = chg > 0 ? 'green' : chg < 0 ? 'red' : '';
  const relCls = rel > 0 ? 'up' : rel < 0 ? 'dn' : 'neu';
  return `<td class="p-col">
    <span class="p-chg ${chgCls}">${chg > 0 ? '+' : ''}${chg.toFixed(1)}%</span>
    <span class="p-rel ${relCls}">${rel > 0 ? '+' : ''}${(rel??0).toFixed(1)}%</span>
  </td>`;
}

// ── 필터링 & 정렬 ─────────────────────────────────────────────────────────────
function filtered() {
  const relKey = REL_KEYS[activePeriod];
  return ALL.filter(s => {
    if (state.mkt !== '전체' && s.market !== state.mkt) return false;
    if (state.dir === '강세' && (s[relKey] ?? 0) <= 0) return false;
    if (state.dir === '약세' && (s[relKey] ?? 0) >= 0) return false;
    if (state.align === '정배열' && !s.full_align) return false;
    if (state.align === '전체정배열' && !s.full_align) return false;
    if (state.sector !== '전체' && s.sector !== state.sector) return false;
    if (state.q && !s.name.includes(state.q) && !s.code.includes(state.q)) return false;
    return true;
  });
}

function sorted(arr) {
  const relKey = REL_KEYS[activePeriod];
  return [...arr].sort((a, b) => {
    if (sortByName) return sortDir * (a.name || '').localeCompare(b.name || '', 'ko');
    return sortDir * ((b[relKey] ?? -Infinity) - (a[relKey] ?? -Infinity));
  });
}

// ── 렌더 ─────────────────────────────────────────────────────────────────────
function render() {
  const rows = sorted(filtered());
  const relKey = REL_KEYS[activePeriod];
  const ups = rows.filter(s => (s[relKey] ?? 0) > 0);
  const dns = rows.filter(s => (s[relKey] ?? 0) <= 0);

  document.getElementById('count-label').textContent = `${rows.length}개 종목 · ${PERIOD_LABELS[activePeriod]} 상대강도 순`;

  let html = '';
  if (ups.length && dns.length) {
    html += `<tr class="section-row"><td colspan="7">▲ 시장 대비 강세 (${ups.length}개)</td></tr>`;
    ups.forEach(s => { html += rowHtml(s); });
    html += `<tr class="section-row"><td colspan="7">▼ 시장 대비 약세 (${dns.length}개)</td></tr>`;
    dns.forEach(s => { html += rowHtml(s); });
  } else {
    rows.forEach(s => { html += rowHtml(s); });
  }
  if (!rows.length) html = '<tr><td colspan="7" class="empty">조건에 맞는 종목이 없습니다.</td></tr>';
  document.getElementById('table-body').innerHTML = html;

  // mobile cards
  let cards = '';
  if (ups.length && dns.length) {
    if (ups.length) { cards += `<div style="font-size:11px;font-weight:600;color:#555;padding:6px 0">▲ 강세 ${ups.length}개</div>`; ups.forEach(s => { cards += cardHtml(s); }); }
    if (dns.length) { cards += `<div style="font-size:11px;font-weight:600;color:#555;padding:12px 0 6px">▼ 약세 ${dns.length}개</div>`; dns.forEach(s => { cards += cardHtml(s); }); }
  } else {
    rows.forEach(s => { cards += cardHtml(s); });
  }
  document.getElementById('card-list').innerHTML = cards || '<div class="empty">조건에 맞는 종목이 없습니다.</div>';

  updateSortHeaders();
}

function rowHtml(s) {
  const mini = s.candles ? chartSvg(s.candles, s.ma5_line||[], s.ma10_line||[], s.ma20_line||[], s.ma30_line||[], 88, 40) : '';
  return `<tr>
    <td>
      <div class="stock-name">${s.name}</div>
      <div style="display:flex;gap:4px;margin-top:3px">
        <span class="${(s.market||'').toLowerCase()}">${s.market||''}</span>
        <span class="sector-tag">${s.sector || ''}</span>
      </div>
    </td>
    <td class="mini-chart">${mini}</td>
    ${periodCell(s, 0)}
    ${periodCell(s, 1)}
    ${periodCell(s, 2)}
    ${periodCell(s, 3)}
    <td>${fmtAlign(s)}</td>
  </tr>`;
}

function cardHtml(s) {
  const relKey = REL_KEYS[activePeriod];
  const chgKey = CHG_KEYS[activePeriod];
  const rel = s[relKey] ?? 0, chg = s[chgKey] ?? 0;
  const relCls = rel > 0 ? 'green' : 'red';
  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="card-name">${s.name}</div>
        <div style="display:flex;gap:4px;margin-top:3px">
          <span class="${(s.market||'').toLowerCase()}">${s.market||''}</span>
          <span class="sector-tag">${s.sector || ''}</span>
        </div>
      </div>
      <div style="text-align:right">${fmtAlign(s)}</div>
    </div>
    <div class="card-divider"></div>
    <div class="card-grid">
      <div>
        <div class="card-item-label">${PERIOD_LABELS[activePeriod]} 등락</div>
        <div class="card-item-val"><span class="${chg>0?'green':'red'}">${chg>0?'+':''}${chg.toFixed(1)}%</span></div>
      </div>
      <div>
        <div class="card-item-label">시장 등락</div>
        <div class="card-item-val">${fmtChg(s.market_chg)}</div>
      </div>
      <div>
        <div class="card-item-label">상대강도</div>
        <div class="card-item-val"><span class="${relCls}">${rel>0?'+':''}${rel.toFixed(1)}%</span></div>
      </div>
    </div>
  </div>`;
}

function updateSortHeaders() {
  document.querySelectorAll('#main-table th.period-th').forEach((th, i) => {
    const isSorted = !sortByName && i === activePeriod;
    th.classList.toggle('sorted', isSorted);
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = isSorted ? (sortDir === -1 ? '▼' : '▲') : '↕';
  });
  const nameTh = document.querySelector('#main-table th[data-sort="name"]');
  if (nameTh) {
    nameTh.classList.toggle('sorted', sortByName);
    const arrow = nameTh.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = sortByName ? (sortDir === -1 ? '▼' : '▲') : '↕';
  }
}

// ── 기간 탭 / 컬럼 클릭 ──────────────────────────────────────────────────────
document.querySelectorAll('#period-tabs .period-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const i = parseInt(tab.dataset.period);
    activePeriod = i; sortDir = -1; sortByName = false;
    document.querySelectorAll('#period-tabs .period-tab').forEach((t,j) => t.classList.toggle('active', j===i));
    syncMktPeriods(i);
    render();
  });
});

document.querySelectorAll('#main-table th.period-th').forEach((th, i) => {
  th.addEventListener('click', () => {
    if (!sortByName && activePeriod === i) { sortDir *= -1; }
    else { activePeriod = i; sortDir = -1; sortByName = false; }
    document.querySelectorAll('#period-tabs .period-tab').forEach((t,j) => t.classList.toggle('active', j===i));
    syncMktPeriods(i);
    render();
  });
});

document.querySelector('#main-table th[data-sort="name"]').addEventListener('click', () => {
  if (sortByName) { sortDir *= -1; }
  else { sortByName = true; sortDir = 1; }
  render();
});

function syncMktPeriods(i) {
  ['kospi-periods','kosdaq-periods'].forEach(id => {
    document.querySelectorAll(`#${id} .mkt-period`).forEach(p => p.classList.toggle('active', parseInt(p.dataset.i) === i));
  });
}

['kospi-periods','kosdaq-periods'].forEach(id => {
  document.querySelectorAll(`#${id} .mkt-period`).forEach(p => {
    p.addEventListener('click', () => {
      const i = parseInt(p.dataset.i);
      activePeriod = i; sortDir = -1; sortByName = false;
      document.querySelectorAll('#period-tabs .period-tab').forEach((t,j) => t.classList.toggle('active', j===i));
      syncMktPeriods(i);
      render();
    });
  });
});

// ── 필터 버튼 ─────────────────────────────────────────────────────────────────
document.querySelectorAll('[data-group]').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = btn.dataset.group;
    document.querySelectorAll(`[data-group="${g}"]`).forEach(b => b.classList.remove('active-mkt','active-dir','active-align'));
    btn.classList.add(g==='mkt'?'active-mkt':g==='dir'?'active-dir':'active-align');
    state[g] = btn.dataset.val;
    render();
  });
});

document.getElementById('sector-select').addEventListener('change', e => { state.sector = e.target.value; render(); });
document.getElementById('search-input').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });

// ── 초기화 ───────────────────────────────────────────────────────────────────
function init() {
  fetch('screener_result.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      if (data.updated) document.getElementById('updated-label').textContent = '기준 ' + data.updated;

      const kospiChgs  = data.kospi_chgs  || [data.kospi_chg  || 0, 0, 0, 0];
      const kosdaqChgs = data.kosdaq_chgs || [data.kosdaq_chg || 0, 0, 0, 0];

      // 지수 기간별 수치
      ['kp','kq'].forEach((pfx, mktIdx) => {
        const chgs = mktIdx === 0 ? kospiChgs : kosdaqChgs;
        for (let i = 0; i < 4; i++) {
          const el = document.getElementById(`${pfx}-${i}`);
          if (!el) continue;
          const v = chgs[i] || 0;
          el.textContent = (v > 0 ? '+' : '') + v.toFixed(2) + '%';
          el.className = 'mkt-period-val ' + (v > 0 ? 'green' : v < 0 ? 'red' : '');
        }
      });

      // 지수 캔들차트
      if (data.kospi_chart)  { requestAnimationFrame(() => drawIndexChart('chart-kospi',  data.kospi_chart)); }
      if (data.kosdaq_chart) { requestAnimationFrame(() => drawIndexChart('chart-kosdaq', data.kosdaq_chart)); }

      // 종목 데이터 — rel 필드 없으면 폴백 계산
      ALL = (data.stocks || []).map(s => {
        const mc = s.market === 'KOSPI' ? kospiChgs[0] : kosdaqChgs[0];
        return {
          ...s,
          market_chg: s.market_chg ?? mc,
          rel:  s.rel  ?? parseFloat(((s.chg  || 0) - mc).toFixed(1)),
          rel2: s.rel2 ?? 0,
          rel3: s.rel3 ?? 0,
          rel4: s.rel4 ?? 0,
          chg2: s.chg2 ?? 0,
          chg3: s.chg3 ?? 0,
          chg4: s.chg4 ?? 0,
        };
      });

      // 업종 드롭다운
      const sects = ['전체', ...new Set(ALL.map(s => s.sector).filter(Boolean))].sort((a,b) => a==='전체'?-1:b==='전체'?1:a.localeCompare(b,'ko'));
      const sel = document.getElementById('sector-select');
      sects.forEach(sec => {
        const opt = document.createElement('option');
        opt.value = sec;
        opt.textContent = sec === '전체' ? '업종 전체' : sec;
        sel.appendChild(opt);
      });

      render();
    })
    .catch(() => {
      document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="empty">데이터를 불러올 수 없습니다. screener_result.json을 확인해주세요.</td></tr>';
    });
}

init();
</script>
</body>
</html>
